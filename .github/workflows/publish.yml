name: Publish

# Publishes to npm via Trusted Publishing (OIDC) when a v* tag is pushed.
# No npm token required: npm trusts this repo + workflow, and provenance
# attestations are generated automatically. Configure the trusted publisher
# once at: npmjs.com -> @12signals/html-distill -> Settings -> Trusted Publisher
#   Organization or user: 12signals
#   Repository:           html-distill
#   Workflow filename:    publish.yml

on:
  push:
    tags:
      - 'v*'

permissions:
  id-token: write   # required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run build:types
      - run: npm publish
